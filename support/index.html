<!-- support.html -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>고객지원 | Devom Labs</title>
  <style>
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif; background:#f8fafc; color:#111827; line-height:1.75; word-break:keep-all; }
    .container { width:min(880px,calc(100% - 40px)); margin:0 auto; }
    header { border-bottom:1px solid #e5e7eb; background:rgba(248,250,252,.9); backdrop-filter:blur(14px); }
    .nav { height:72px; display:flex; align-items:center; justify-content:space-between; }
    .brand { font-weight:800; font-size:20px; text-decoration:none; color:#111827; }
    .home { color:#2563eb; text-decoration:none; font-weight:700; }
    main { padding:72px 0 96px; }
    h1 { font-size:42px; letter-spacing:-1.5px; margin-bottom:12px; }
    h2 { margin-top:0; font-size:22px; }
    p, li { color:#64748b; }
    a { color:#2563eb; }
    .card { background:#fff; border:1px solid #e5e7eb; border-radius:24px; padding:28px; margin-top:24px; box-shadow:0 18px 50px rgba(15,23,42,.06); }
    footer { border-top:1px solid #e5e7eb; padding:32px 0; color:#64748b; font-size:14px; }

</head>
<body>
<header>
  <div class="container nav">
    <a class="brand" href="/">Devom Labs</a>

  <div class="card">
    <h2>문의 이메일</h2>
    <p><a href="mailto:contact@devomlabs.com">contact@devomlabs.com</a></p>
  </div>

  <div class="card">
    <h2>문의 시 포함하면 좋은 내용</h2>
    <ul>
      <li>이용 중인 서비스명</li>
      <li>문의 또는 오류 내용</li>
      <li>오류가 발생한 화면 또는 상황</li>

</main>

<footer>
